<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FestPass 2026</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    #status { padding: .5rem; background: #eef2ff; }
    form { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
    input, select, button { padding: .55rem; font: inherit; }
  </style>
</head>
<body>
  <h1>FestPass 2026 registrations</h1>
  <p id="status">Checking the backend...</p>
  <form id="form">
    <label>Name <input id="name" required></label>
    <label>Event
      <select id="event" required>
        <option>Hackathon</option>
        <option>Robo Race</option>
        <option>Tech Quiz</option>
      </select>
    </label>
    <button type="submit">Register</button>
  </form>
  <h2>Registrations</h2>
  <ul id="list"></ul>
  <script>
    const api = (path, options) => fetch("/api/" + path, options).then((response) => response.json());
    async function refresh() {
      const status = document.getElementById("status");
      try {
        const health = await api("health");
        status.textContent = `REGNO ${health.regno} | backend ${health.version} on ${health.container} | database ${health.database ? "connected" : "not connected"}`;
        const rows = await api("registrations");
        document.getElementById("list").replaceChildren(...(Array.isArray(rows) ? rows : []).map((row) => {
          const item = document.createElement("li");
          item.textContent = `#${row.id} ${row.name} (${row.event})`;
          return item;
        }));
      } catch (_error) {
        status.textContent = "Backend not reachable";
      }
    }
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      await api("registrations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("name").value,
          event: document.getElementById("event").value,
        }),
      });
      document.getElementById("name").value = "";
      refresh();
    });
    refresh();
  </script>
</body>
</html>
